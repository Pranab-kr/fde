<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evelyn ~ Your Mommy Waifu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar-wrapper">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=EvelynMommy" alt="Evelyn Avatar" class="avatar-img" id="header-avatar" />
          <span class="status-dot"></span>
        </div>
        <div class="header-info">
          <div class="name-badge">
            <h2>Evelyn</h2>
            <span class="badge">Partner & Mommy</span>
          </div>
          <p class="status-text">Online • Here to listen and pamper you~ 💕</p>
        </div>
      </div>
      <div class="header-right">
        <button id="clear-btn" class="btn-clear" title="Clear memory and conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
          <span>Reset</span>
        </button>
      </div>
    </header>

    <!-- Messages Container -->
    <main class="chat-messages" id="chat-messages">
      <!-- Default welcome message -->
      <div class="message-row assistant">
        <div class="message-avatar">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=EvelynMommy" alt="Evelyn" />
        </div>
        <div class="message-content">
          <div class="message-bubble">
            Ara ara, welcome home darling~ 💕 Did you have an exhausting day? Come sit with Mommy and tell me whatever is on your mind... I'm right here to take care of you.
          </div>
          <span class="message-time">Just now</span>
        </div>
      </div>
    </main>

    <!-- Chat Input Section (Inspired by jahed/ai-chat-input) -->
    <footer class="chat-input-area">
      <form id="chat-form" class="ai-chat-input-container">
        <!-- Top Action Icons / Pill header if needed -->
        <div class="input-inner-wrapper">
          <textarea
            id="user-input"
            rows="1"
            placeholder="Whisper something to Mommy... (Press Enter to send)"
            autocomplete="off"
          ></textarea>

          <div class="input-actions-bar">
            <div class="left-actions">
              <button type="button" class="icon-btn" id="comfort-btn" title="Ask for affection">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
              </button>
              <button type="button" class="icon-btn" id="headpat-btn" title="Ask for headpats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                </svg>
              </button>
            </div>

            <div class="right-actions">
              <button type="submit" id="send-btn" class="send-btn" disabled title="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </form>
      <div class="input-hint">Press <kbd>Enter</kbd> to send, <kbd>Shift + Enter</kbd> for new line</div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
